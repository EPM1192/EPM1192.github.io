<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I's factory</title>
  <meta name="description" content="I's factory。英語学習アプリ「らぶりん英会話」の開発元です。話して、振り返る。">
  <link rel="canonical" href="https://epm1192.github.io/">
  <meta property="og:title" content="I's factory">
  <meta property="og:description" content="話して、振り返る。らぶりん英会話の開発元です。">
  <meta property="og:url" content="https://epm1192.github.io/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:image" content="https://epm1192.github.io/poster.jpg">
  <meta name="theme-color" content="#f7f6f3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f7f6f3;
      --ink: #2c2a27;
      --muted: #7a756c;
      --line: #e4e0d8;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
      font-weight: 400;
      font-size: 16px;
      line-height: 1.9;
    }
    a { color: var(--ink); text-underline-offset: 0.22em; }
    a:hover { opacity: 0.55; }
    .wrap { width: min(42rem, calc(100% - 3rem)); margin: 0 auto; }
    .hero {
      position: relative;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      overflow: hidden;
    }
    .hero-media,
    .hero-media img,
    .hero-media video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 42%;
    }
    .hero-media img { z-index: 0; }
    .hero-media video { z-index: 1; }
    .hero header {
      position: relative;
      z-index: 2;
      width: min(42rem, calc(100% - 3rem));
      margin: 0 auto;
      padding: 1.8rem 0 0;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1.5rem;
    }
    .brand {
      font-family: "Shippori Mincho", serif;
      font-weight: 500;
      letter-spacing: 0.08em;
      font-size: 0.92rem;
      text-decoration: none;
    }
    header nav {
      display: flex;
      gap: 1.6rem;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
    }
    header nav a { color: var(--muted); text-decoration: none; }
    .hero-copy {
      position: relative;
      z-index: 2;
      margin-top: auto;
      width: min(42rem, calc(100% - 3rem));
      padding: 0 0 11vh;
      margin-left: auto;
      margin-right: auto;
    }
    h1 {
      font-family: "Shippori Mincho", serif;
      font-weight: 500;
      font-size: clamp(2.6rem, 8vw, 4.1rem);
      line-height: 1.32;
      letter-spacing: 0.08em;
      margin: 0;
    }
    .lede {
      margin: 1.1rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }
    section.block {
      padding: 5.5rem 0;
      border-top: 1px solid var(--line);
    }
    h2 {
      font-family: "Shippori Mincho", serif;
      font-weight: 500;
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      color: var(--muted);
      margin: 0 0 1.6rem;
    }
    .quiet { color: var(--muted); margin: 0.7rem 0 0; }
    .cta {
      display: inline-block;
      margin-top: 1.8rem;
      text-decoration: none;
      letter-spacing: 0.08em;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 0.12rem;
    }
    .fine {
      margin: 2.2rem 0 0;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.75;
    }
    footer {
      padding: 3.5rem 0 4.5rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
    }
    footer .foot-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem 1.5rem;
      margin: 0 0 1.2rem;
    }
    footer a { color: var(--muted); text-decoration: none; }
    footer p { margin: 0.15rem 0; }
    @media (max-width: 520px) {
      header nav { gap: 1rem; }
      .hero-copy { padding-bottom: 8vh; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-media">
      <img src="poster.jpg" alt="">
      <video id="hero-video" autoplay muted loop playsinline poster="poster.jpg">
        <source src="hero.webm" type="video/webm">
        <source src="hero.mp4" type="video/mp4">
      </video>
    </div>
    <header>
      <a class="brand" href="/">I's factory</a>
      <nav>
        <a href="#app">App</a>
        <a href="#about">Studio</a>
      </nav>
    </header>
    <div class="hero-copy">
      <h1>話して、振り返る。</h1>
      <p class="lede">らぶりん英会話の、開発元です。</p>
    </div>
  </section>

  <div class="wrap">
    <section class="block" id="app">
      <h2>APP</h2>
      <p>英語、話して終わりになっていない人向け。</p>
      <p class="quiet">日本の App Store で公開しています。</p>
      <a class="cta" href="https://apps.apple.com/jp/app/id6792189779">App Store</a>
      <p class="fine">一部の機能は広告・チケットで追加できます。ログインして別の端末へ引き継ぐ機能や、サブスクはありません。米国ストアでは配信していません。</p>
    </section>

    <section class="block" id="about">
      <h2>STUDIO</h2>
      <p>少人数で、日本からつくっています。</p>
      <p class="quiet">長い話は <a href="https://note.com/lovelin_english">note</a> に置いています。</p>
    </section>

    <footer id="support">
      <div class="foot-links">
        <a href="https://different-bearberry-4e5.notion.site/3a165e25d0fc8012b317c79485ae2e69">プライバシーポリシー</a>
        <a href="mailto:isfactoryforgmail@gmail.com">サポート</a>
      </div>
      <p>isfactoryforgmail@gmail.com</p>
      <p>© I's factory</p>
    </footer>
  </div>
  <script>
    (function () {
      var v = document.getElementById("hero-video");
      if (!v) return;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        v.pause();
        v.removeAttribute("autoplay");
      }
    })();
  </script>
</body>
</html>
