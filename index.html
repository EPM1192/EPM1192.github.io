<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I's factory</title>
  <meta name="description" content="I's factory。英語学習アプリ「らぶりん英会話」の開発元です。話して、振り返る。">
  <link rel="canonical" href="https://epm1192.github.io/">
  <meta property="og:title" content="I's factory">
  <meta property="og:description" content="話して、振り返る。らぶりん英会話の開発元です。">
  <meta property="og:url" content="https://epm1192.github.io/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta name="theme-color" content="#f7f6f3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f7f6f3;
      --ink: #2c2a27;
      --muted: #7a756c;
      --line: #e4e0d8;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
      font-weight: 400;
      font-size: 16px;
      line-height: 1.9;
    }
    a { color: var(--ink); text-underline-offset: 0.22em; }
    a:hover { opacity: 0.55; }
    .wrap { width: min(38rem, calc(100% - 3rem)); margin: 0 auto; }
    header {
      padding: 2rem 0 0;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1.5rem;
      opacity: 0;
      animation: fade-only 1.1s ease 0.05s forwards;
    }
    .brand {
      font-family: "Shippori Mincho", serif;
      font-weight: 500;
      letter-spacing: 0.08em;
      font-size: 0.92rem;
      text-decoration: none;
    }
    header nav {
      display: flex;
      gap: 1.6rem;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    header nav a { color: var(--muted); text-decoration: none; }
    .hero {
      min-height: 72vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4rem 0 5rem;
      border-top: 0;
    }
    h1 {
      font-family: "Shippori Mincho", serif;
      font-weight: 500;
      font-size: clamp(2.4rem, 8vw, 3.6rem);
      line-height: 1.35;
      letter-spacing: 0.08em;
      margin: 0;
    }
    h1 .ch {
      display: inline-block;
      opacity: 0;
      transform: translateY(0.35em);
      animation: rise 1.05s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: calc(0.18s + var(--i) * 0.07s);
    }
    .lede {
      margin: 1.6rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      opacity: 0;
      transform: translateY(0.6rem);
      animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.95s forwards;
    }
    section {
      padding: 5.5rem 0;
      border-top: 1px solid var(--line);
    }
    h2 {
      font-family: "Shippori Mincho", serif;
      font-weight: 500;
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      color: var(--muted);
      margin: 0 0 1.6rem;
    }
    .quiet { color: var(--muted); margin: 0.7rem 0 0; }
    .cta {
      display: inline-block;
      margin-top: 1.8rem;
      text-decoration: none;
      letter-spacing: 0.08em;
      font-size: 0.9rem;
      padding-bottom: 0.12rem;
      background-image: linear-gradient(currentColor, currentColor);
      background-repeat: no-repeat;
      background-position: left 100%;
      background-size: 100% 1px;
      transition: background-size 0.45s ease, opacity 0.2s ease;
    }
    .cta:hover {
      opacity: 1;
      background-size: 28% 1px;
    }
    .fine {
      margin: 2.2rem 0 0;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.75;
    }
    .reveal {
      opacity: 0;
      transform: translateY(1.1rem);
      transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1), transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal.in {
      opacity: 1;
      transform: none;
    }
    footer {
      padding: 3.5rem 0 4.5rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
    }
    footer .foot-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem 1.5rem;
      margin: 0 0 1.2rem;
    }
    footer a { color: var(--muted); text-decoration: none; }
    footer p { margin: 0.15rem 0; }
    @keyframes rise {
      to {
        opacity: 1;
        transform: none;
      }
    }
    @keyframes fade-only {
      to { opacity: 1; }
    }
    @media (max-width: 520px) {
      header nav { gap: 1rem; }
      .hero { min-height: 62vh; padding: 3.2rem 0 3.5rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      header,
      h1 .ch,
      .lede,
      .reveal {
        opacity: 1;
        transform: none;
        animation: none;
        transition: none;
      }
      .cta { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="/">I's factory</a>
      <nav>
        <a href="#app">App</a>
        <a href="#about">Studio</a>
      </nav>
    </header>

    <section class="hero">
      <h1 aria-label="話して、振り返る。"><span class="ch" style="--i:0">話</span><span class="ch" style="--i:1">し</span><span class="ch" style="--i:2">て</span><span class="ch" style="--i:3">、</span><span class="ch" style="--i:4">振</span><span class="ch" style="--i:5">り</span><span class="ch" style="--i:6">返</span><span class="ch" style="--i:7">る</span><span class="ch" style="--i:8">。</span></h1>
      <p class="lede">らぶりん英会話の、開発元です。</p>
    </section>

    <section id="app" class="reveal">
      <h2>APP</h2>
      <p>英語、話して終わりになっていない人向け。</p>
      <p class="quiet">日本の App Store で公開しています。</p>
      <a class="cta" href="https://apps.apple.com/jp/app/id6792189779">App Store</a>
      <p class="fine">一部の機能は広告・チケットで追加できます。ログインして別の端末へ引き継ぐ機能や、サブスクはありません。米国ストアでは配信していません。</p>
    </section>

    <section id="about" class="reveal">
      <h2>STUDIO</h2>
      <p>少人数で、日本からつくっています。</p>
      <p class="quiet">長い話は <a href="https://note.com/lovelin_english">note</a> に置いています。</p>
    </section>

    <footer id="support" class="reveal">
      <div class="foot-links">
        <a href="https://different-bearberry-4e5.notion.site/3a165e25d0fc8012b317c79485ae2e69">プライバシーポリシー</a>
        <a href="mailto:isfactoryforgmail@gmail.com">サポート</a>
      </div>
      <p>isfactoryforgmail@gmail.com</p>
      <p>© I's factory</p>
    </footer>
  </div>
  <script>
    (function () {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var nodes = document.querySelectorAll(".reveal");
      if (reduce || !("IntersectionObserver" in window)) {
        for (var i = 0; i < nodes.length; i++) nodes[i].classList.add("in");
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("in");
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.18, rootMargin: "0px 0px -8% 0px" });
      for (var j = 0; j < nodes.length; j++) io.observe(nodes[j]);
    })();
  </script>
</body>
</html>
